<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="robots" content="noindex, nofollow">
<title>ネクロニカ キャラクターシート</title>
<style>
:root {
  --bg: #0f0f12;
  --card: #18181c;
  --red: #8b0000;
  --text: #e0e0e0;
  --border: #3a3a42;
  --input: #222228;
  --header-bg: #1a1a20;
}
* { box-sizing: border-box; }
body {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Georgia", serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 12px;
  font-size: 13px;
}
h1 {
  text-align: center;
  color: #f0a0a0;
  font-size: 1.4rem;
  margin: 0 0 12px 0;
  font-weight: bold;
  letter-spacing: 3px;
  border-bottom: 1px solid var(--red);
  padding-bottom: 6px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px;
  margin-bottom: 12px;
}
.title {
  font-size: .95rem;
  font-weight: bold;
  color: #f0a0a0;
  border-bottom: 2px solid var(--red);
  padding-bottom: 4px;
  margin-bottom: 8px;
  font-family: serif;
}
.part-header {
  background: #2a0808;
  border: 1px solid var(--red);
  color: #ffffff;
  padding: 4px 8px;
  font-weight: bold;
  font-size: .9rem;
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  letter-spacing: 1px;
}
.part-header .val {
  font-size: .75rem;
  color: #ddd;
  font-weight: normal;
}
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
label { display: block; font-size: .75rem; color: #aaa; margin-bottom: 2px; }
input, select, textarea {
  width: 100%;
  padding: 5px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--input);
  color: #fff;
  font-size: .85rem;
  font-family: sans-serif;
  text-align: center;
}
input[type="text"] { text-align: left; }
.table-scroll { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 4px; min-width: 100%; }
th, td { border: 1px solid var(--border); padding: 4px 2px; text-align: center; font-size: .8rem; }
th { background: var(--header-bg); color: #eee; font-weight: normal; letter-spacing: 1px; }
.calc-table { background: #121215; margin-bottom: 8px; }
.calc-table th { background: #22222a; color: #ccc; font-weight: bold; }
.calc-table td.label-cell { background: #1e1e24; text-align: right; padding-right: 8px; font-weight: bold; color: #ddd; }
.calc-table input[type="number"] { width: 100%; background: #18181c; border: 1px solid #444; color: #fff; font-weight: bold; }
.calc-table input[type="radio"] { width: 18px; height: 18px; accent-color: var(--red); cursor: pointer; margin: 0 auto; }
.calc-table .total-row td { background: #2a0808; color: #fff; font-size: 1rem; font-weight: bold; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
button {
  padding: 8px;
  border: none;
  border-radius: 4px;
  background: var(--red);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  font-size: .85rem;
  font-family: sans-serif;
}
button:hover { opacity: 0.9; }
button.sec { background: #4a4a52; }
button.del { background: #522; color: #f88; padding: 2px 6px; }
.add-part-select {
  width: 100%;
  margin-top: 6px;
  padding: 6px;
  background: #25252d;
  color: #f0a0a0;
  border: 1px dashed var(--border);
  border-radius: 3px;
  font-size: .8rem;
  cursor: pointer;
}
tr.broken input {
  text-decoration: line-through;
  opacity: 0.5;
}
</style>
</head>

// ポジションやクラスが変更されたときに、「区分」の選択肢を更新する関数
function updateSkillCategoryOptions() {
  // 1. ポジション、メインクラス、サブクラスの要素を取得
  const posElem = document.getElementById('position-select');
  const mainElem = document.getElementById('main-class-select');
  const subElem = document.getElementById('sub-class-select');

  if (!posElem || !mainElem || !subElem) return;

  // 2. 現在選択されている「名前のみ」を取得
  const positionName = posElem.value;
  const mainClassName = mainElem.value;
  const subClassName = subElem.value;

  // 3. 区分として表示する名前リスト（ポジション名・クラス名のみ）
  const categories = [];
  
  if (positionName) {
    categories.push(positionName);
  }
  
  if (mainClassName) {
    categories.push(mainClassName);
  }
  
  // サブクラスが存在し、メインクラスと重複していない場合のみ追加
  if (subClassName && subClassName !== mainClassName) {
    categories.push(subClassName);
  }

  // 4. スキル欄の「区分」プルダウンを取得して書き換え
  const categorySelects = document.querySelectorAll('.skill-category-select');

  categorySelects.forEach(select => {
    // 選択されていた値を覚えておく
    const selectedValue = select.value;

    // 中身を一度クリアし、先頭に「選択なし」枠だけ入れる
    select.innerHTML = '<option value="">選択</option>';

    // ポジション名・クラス名だけを<option>として追加
    categories.forEach(name => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name; // 例: 「オートマトン」「ステーシー」のみが入ります
      select.appendChild(option);
    });

    // 以前選んでいた名前があれば選択状態を維持
    if (categories.includes(selectedValue)) {
      select.value = selectedValue;
    }
  });
}

// --------------------------------------------------
// ポジション・クラス変更時に呼び出される連動処理
// --------------------------------------------------
function updateSkillRowsFromClass() {
  const pos = document.getElementById('pos').value;
  const mc = document.getElementById('mc').value;
  const sc = document.getElementById('sc').value;

  const tbody = document.getElementById('skill-tbody');
  if (!tbody) return;

  if (tbody.children.length === 0) {
    addPosSkillRow();
    addClassSkillRow();
    addClassSkillRow();
  }

  const rows = tbody.querySelectorAll('tr');

  // 【ポジション枠の更新】
  if (rows[0]) {
    const typeInput = rows[0].querySelector('.sk-type');
    if (typeInput) typeInput.value = `ポジション（${pos}）`;
    updateSkillSelectOptions(rows[0].querySelector('.sk-select'), [pos]);
  }

  // 【クラス枠の更新】
  const classCategories = Array.from(new Set([mc, sc]));

  for (let i = 1; i < rows.length; i++) {
    const typeInput = rows[i].querySelector('.sk-type');
    if (typeInput && !typeInput.dataset.manual) {
      if (i === 1) typeInput.value = `メインクラス（${mc}）`;
      else if (i === 2) typeInput.value = `サブクラス（${sc}）`;
      else typeInput.value = `追加クラススキル`;
    }
    updateSkillSelectOptions(rows[i].querySelector('.sk-select'), classCategories);
  }
}

// --------------------------------------------------
// ドロップダウンの選択肢（<option>）を動的に生成する処理
// --------------------------------------------------
function updateSkillSelectOptions(selectElem, categories) {
  if (!selectElem) return;

  const currentVal = selectElem.value;
  selectElem.innerHTML = '<option value="">-- スキルを選択 --</option>';

  categories.forEach(cat => {
    const skills = SKILL_DATABASE[cat];
    if (skills) {
      const group = document.createElement('optgroup');
      group.label = `【${cat}】`;
      
      skills.forEach(s => {
        const opt = document.createElement('option');
        opt.value = JSON.stringify({ cat: cat, name: s.name, memo: s.memo });
        opt.textContent = s.name;
        group.appendChild(opt);
      });
      
      selectElem.appendChild(group);
    }
  });

  if (currentVal) {
    selectElem.value = currentVal;
  }
}


function addPosSkillRow(type='', name='', memo='') {
  const tbody = document.getElementById('skill-tbody');
  if (!tbody) return;
  const pos = document.getElementById('pos').value;
  const displayType = type || `ポジション（${pos}）`;
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" class="sk-type" value="${displayType}" placeholder="ポジション" readonly style="background:#151518;color:#aaa;"></td>
    <td>
      <select class="sk-select" onchange="onSkillSelectChange(this)">
        <option value="">-- スキルを選択 --</option>
      </select>
    </td>
    <td><input type="text" class="sk-name" value="${name}" placeholder="スキル名"></td>
    <td><input type="text" class="sk-memo" value="${memo}" placeholder="効果メモ"></td>
    <td style="color:#666;font-size:.75rem;">固定</td>
  `;
  tbody.appendChild(tr);
}

function addClassSkillRow(type='', name='', memo='') {
  const tbody = document.getElementById('skill-tbody');
  if (!tbody) return;
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" class="sk-type" value="${type}" placeholder="区分" oninput="this.dataset.manual='true'"></td>
    <td>
      <select class="sk-select" onchange="onSkillSelectChange(this)">
        <option value="">-- スキルを選択 --</option>
      </select>
    </td>
    <td><input type="text" class="sk-name" value="${name}" placeholder="スキル名"></td>
    <td><input type="text" class="sk-memo" value="${memo}" placeholder="効果メモ"></td>
    <td><button type="button" class="del" onclick="this.closest('tr').remove()">削除</button></td>
  `;
  tbody.appendChild(tr);

  const mc = document.getElementById('mc').value;
  const sc = document.getElementById('sc').value;
  updateSkillSelectOptions(tr.querySelector('.sk-select'), Array.from(new Set([mc, sc])));
}

function onSkillSelectChange(selectElem) {
  const tr = selectElem.closest('tr');
  if (!selectElem.value) return;
  try {
    const data = JSON.parse(selectElem.value);
    if (tr.querySelector('.sk-name')) tr.querySelector('.sk-name').value = data.name;
    if (tr.querySelector('.sk-memo')) tr.querySelector('.sk-memo').value = data.memo;
  } catch(e) {}
}

function calcTotals() {
  const mc = document.getElementById('mc').value;
  const sc = document.getElementById('sc').value;
  const mcVal = CLASS_PARTS[mc] || [0,0,0];
  const scVal = CLASS_PARTS[sc] || [0,0,0];

  let bonusWep = 0, bonusMut = 0, bonusCyb = 0;
  const bonus = document.querySelector('input[name="bonus"]:checked');
  if (bonus) {
    if (bonus.value === 'wep') bonusWep = 1;
    if (bonus.value === 'mut') bonusMut = 1;
    if (bonus.value === 'cyb') bonusCyb = 1;
  }

  const cWep = parseInt(document.getElementById('chouai-wep').value) || 0;
  const cMut = parseInt(document.getElementById('chouai-mut').value) || 0;
  const cCyb = parseInt(document.getElementById('chouai-cyb').value) || 0;

  document.getElementById('total-wep').textContent = mcVal[0] + scVal[0] + bonusWep + cWep;
  document.getElementById('total-mut').textContent = mcVal[1] + scVal[1] + bonusMut + cMut;
  document.getElementById('total-cyb').textContent = mcVal[2] + scVal[2] + bonusCyb + cCyb;
}

function getPartsForSection(secId) {
  const bParts = BASIC_PARTS[secId] || [];
  const filterFn = p => !p.part || p.part === 'all' || p.part === secId;

  return [
    ...bParts,
    ...WEAPON_PARTS.filter(filterFn),
    ...MUTATION_PARTS.filter(filterFn),
    ...CYBER_PARTS.filter(filterFn)
  ];
}

function renderPartsSections() {
  const container = document.getElementById('parts-container');
  container.innerHTML = '';

  SECTIONS.forEach(sec => {
    const secDiv = document.createElement('div');
    secDiv.className = 'part-section';

    let optionsHtml = `<option value="">+ ${sec.name}パーツを選択して追加...</option>`;
    optionsHtml += `<option value="empty">+ 【手入力用】空の行を追加</option>`;

    const availableParts = getPartsForSection(sec.id);
    const groups = {};
    availableParts.forEach(p => {
      if (!groups[p.group]) groups[p.group] = [];
      groups[p.group].push(p);
    });

    Object.keys(groups).forEach(groupName => {
      optionsHtml += `<optgroup label="【${groupName}】">`;
      groups[groupName].forEach(p => {
        const jsonVal = JSON.stringify(p).replace(/"/g, '&quot;');
        optionsHtml += `<option value="${jsonVal}">${p.name}（${p.timing}/${p.effect}）</option>`;
      });
      optionsHtml += `</optgroup>`;
    });

    secDiv.innerHTML = `
      <div class="part-header">
        <span>${sec.name}パーツ</span>
        <span class="val">破損判定: ${sec.val}</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:8%">破損</th>
              <th style="width:22%">名称</th>
              <th style="width:15%">タイミング</th>
              <th style="width:10%">コスト</th>
              <th style="width:10%">射程</th>
              <th style="width:27%">効果</th>
              <th style="width:8%">操作</th>
            </tr>
          </thead>
          <tbody id="parts-tbody-${sec.id}"></tbody>
        </table>
      </div>
      <select class="add-part-select" onchange="addPartFromSelect(this, '${sec.id}')">
        ${optionsHtml}
      </select>
    `;
    container.appendChild(secDiv);
  });
}

function addPartFromSelect(selectElem, secId) {
  if (!selectElem.value) return;
  if (selectElem.value === 'empty') {
    addPartRow(secId, false, '', '', '', '', '');
  } else {
    try {
      const p = JSON.parse(selectElem.value);
      addPartRow(secId, false, p.name, p.timing, p.cost, p.range, p.effect);
    } catch(e) {}
  }
  selectElem.value = '';
}

function addPartRow(secId, broken=false, name='', timing='', cost='', range='', effect='') {
  const tbody = document.getElementById(`parts-tbody-${secId}`);
  if (!tbody) return;
  const tr = document.createElement('tr');
  if (broken) tr.classList.add('broken');
  tr.innerHTML = `
    <td><input type="checkbox" class="p-broken" ${broken ? 'checked' : ''} onchange="toggleBroken(this)"></td>
    <td><input type="text" class="p-name" value="${name}" placeholder="パーツ名"></td>
    <td><input type="text" class="p-timing" value="${timing}" placeholder="タイミング"></td>
    <td><input type="text" class="p-cost" value="${cost}" placeholder="コスト"></td>
    <td><input type="text" class="p-range" value="${range}" placeholder="射程"></td>
    <td><input type="text" class="p-effect" value="${effect}" placeholder="効果"></td>
    <td><button type="button" class="del" onclick="this.closest('tr').remove()">削除</button></td>
  `;
  tbody.appendChild(tr);
}

function toggleBroken(checkbox) {
  const tr = checkbox.closest('tr');
  if (checkbox.checked) {
    tr.classList.add('broken');
  } else {
    tr.classList.remove('broken');
  }
}

function resetUsed() {
  const checkboxes = document.querySelectorAll('#parts-container input[type="checkbox"]');
  checkboxes.forEach(cb => {
    cb.checked = false;
    toggleBroken(cb);
  });
}

function addRow(target='', emotion='', madness='0') {
  const tbody = document.getElementById('list');
  if (!tbody) return;
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" class="m-target" value="${target}" placeholder="対象名"></td>
    <td><input type="text" class="m-emotion" value="${emotion}" placeholder="未練（感情）"></td>
    <td><input type="number" class="m-madness" value="${madness}" min="0" max="4"></td>
    <td><button type="button" class="del" onclick="this.closest('tr').remove()">削除</button></td>
  `;
  tbody.appendChild(tr);
}

function getFormData() {
  const bonus = document.querySelector('input[name="bonus"]:checked');
  const skills = [];
  document.querySelectorAll('#skill-tbody tr').forEach(tr => {
    skills.push({
      type: tr.querySelector('.sk-type')?.value || '',
      name: tr.querySelector('.sk-name')?.value || '',
      memo: tr.querySelector('.sk-memo')?.value || ''
    });
  });

  const parts = {};
  SECTIONS.forEach(sec => {
    parts[sec.id] = [];
    document.querySelectorAll(`#parts-tbody-${sec.id} tr`).forEach(tr => {
      parts[sec.id].push({
        broken: tr.querySelector('.p-broken')?.checked || false,
        name: tr.querySelector('.p-name')?.value || '',
        timing: tr.querySelector('.p-timing')?.value || '',
        cost: tr.querySelector('.p-cost')?.value || '',
        range: tr.querySelector('.p-range')?.value || '',
        effect: tr.querySelector('.p-effect')?.value || ''
      });
    });
  });

  const miren = [];
  document.querySelectorAll('#list tr').forEach(tr => {
    miren.push({
      target: tr.querySelector('.m-target')?.value || '',
      emotion: tr.querySelector('.m-emotion')?.value || '',
      madness: tr.querySelector('.m-madness')?.value || '0'
    });
  });

  return {
    pl: document.getElementById('pl').value,
    name: document.getElementById('name').value,
    pos: document.getElementById('pos').value,
    mc: document.getElementById('mc').value,
    sc: document.getElementById('sc').value,
    bonus: bonus ? bonus.value : 'wep',
    chouaiWep: document.getElementById('chouai-wep').value,
    chouaiMut: document.getElementById('chouai-mut').value,
    chouaiCyb: document.getElementById('chouai-cyb').value,
    age: document.getElementById('age').value,
    ps: document.getElementById('ps').value,
    hint: document.getElementById('hint').value,
    mem: document.getElementById('mem').value,
    act: document.getElementById('act').value,
    fav: document.getElementById('fav').value,
    tr: document.getElementById('tr').value,
    skills,
    parts,
    miren
  };
}

function loadFormData(data) {
  if (!data) return;
  document.getElementById('pl').value = data.pl || '';
  document.getElementById('name').value = data.name || '';
  document.getElementById('pos').value = data.pos || 'アリス';
  document.getElementById('mc').value = data.mc || 'ロマネスク';
  document.getElementById('sc').value = data.sc || 'ロマネスク';
  
  if (data.bonus) {
    const radio = document.querySelector(`input[name="bonus"][value="${data.bonus}"]`);
    if (radio) radio.checked = true;
  }
  
  document.getElementById('chouai-wep').value = data.chouaiWep || 0;
  document.getElementById('chouai-mut').value = data.chouaiMut || 0;
  document.getElementById('chouai-cyb').value = data.chouaiCyb || 0;
  document.getElementById('age').value = data.age || '';
  document.getElementById('ps').value = data.ps || '煉獄';
  document.getElementById('hint').value = data.hint || '';
  document.getElementById('mem').value = data.mem || '';
  document.getElementById('act').value = data.act || 9;
  document.getElementById('fav').value = data.fav || 0;
  document.getElementById('tr').value = data.tr || '';

  onClassChange();

  // スキル再構築
  const skillTbody = document.getElementById('skill-tbody');
  skillTbody.innerHTML = '';
  if (data.skills && data.skills.length > 0) {
    data.skills.forEach((s, idx) => {
      if (idx === 0) addPosSkillRow(s.type, s.name, s.memo);
      else addClassSkillRow(s.type, s.name, s.memo);
    });
  } else {
    updateSkillRowsFromClass();
  }

  // パーツ再構築
  SECTIONS.forEach(sec => {
    const tbody = document.getElementById(`parts-tbody-${sec.id}`);
    if (tbody) tbody.innerHTML = '';
    if (data.parts && data.parts[sec.id]) {
      data.parts[sec.id].forEach(p => {
        addPartRow(sec.id, p.broken, p.name, p.timing, p.cost, p.range, p.effect);
      });
    }
  });

  // 未練再構築
  const listTbody = document.getElementById('list');
  if (listTbody) listTbody.innerHTML = '';
  if (data.miren && data.miren.length > 0) {
    data.miren.forEach(m => addRow(m.target, m.emotion, m.madness));
  } else {
    addRow();
  }
}

function saveData() {
  const data = getFormData();
  localStorage.setItem('nechronica_sheet_data', JSON.stringify(data));
  alert('ブラウザにデータを保存しました。');
}

function loadData() {
  const saved = localStorage.getItem('nechronica_sheet_data');
  if (!saved) {
    alert('保存データが見つかりませんでした。');
    return;
  }
  loadFormData(JSON.parse(saved));
  alert('データを読み込みました。');
}

function exportJSON() {
  const data = getFormData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${data.name || 'nechronica_doll'}.json`;
  a.click();
}

function exportCcfolia() {
  const data = getFormData();
  let memo = `【PL】${data.pl}\n`;
  memo += `【ポジション】${data.pos} / 【メイン】${data.mc} / 【サブ】${data.sc}\n`;
  memo += `【享年/外見】${data.age} / 【配置】${data.ps}\n`;
  memo += `【暗示】${data.hint} / 【記憶のカケラ】${data.mem}\n`;
  memo += `【たからもの】${data.tr}\n\n`;

  memo += `■スキル\n`;
  data.skills.forEach(s => {
    if (s.name) memo += `・${s.name}（${s.type}）: ${s.memo}\n`;
  });

  memo += `\n■未練\n`;
  data.miren.forEach(m => {
    if (m.target) memo += `・${m.target} : ${m.emotion}（狂気点:${m.madness}）\n`;
  });

  const commands = `NC\n1D10\n2D10\n1D10+1 命中判定`;

  const ccfoliaObj = {
    kind: "character",
    data: {
      name: data.name || "無題のドール",
      memo: memo,
      status: [
        { label: "最大行動値", value: parseInt(data.act) || 0, max: parseInt(data.act) || 0 },
        { label: "獲得寵愛点", value: parseInt(data.fav) || 0, max: 0 }
      ],
      params: [],
      commands: commands
    }
  };

  navigator.clipboard.writeText(JSON.stringify(ccfoliaObj)).then(() => {
    alert('ココフォリア用データをクリップボードにコピーしました！\nココフォリア上で [Ctrl + V] で貼り付けできます。');
  }).catch(() => {
    alert('クリップボードへのコピーに失敗しました。');
  });
}

// 初期化処理
window.addEventListener('DOMContentLoaded', () => {
  onClassChange();
  renderPartsSections();

  // 初期パーツの読み込み
  DEFAULT_PARTS_LIST.forEach(p => {
    addPartRow(p[0], p[1], p[2], p[3], p[4], p[5], p[6]);
  });

  // 初期未練枠
  addRow();
});
</script>
