<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ネクロニカ キャラクターシート</title>
<style>
:root {
  --bg: #0f0f12;
  --card: #18181c;
  --red: #8b0000;
  --text: #e0e0e0;
  --border: #3a3a42;
  --input: #222228;
  --header-bg: #1a1a20;
}
* { box-sizing: border-box; }
body {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "Georgia", serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 12px;
  font-size: 13px;
}
h1 {
  text-align: center;
  color: #f0a0a0;
  font-size: 1.4rem;
  margin: 0 0 12px 0;
  font-weight: bold;
  letter-spacing: 3px;
  border-bottom: 1px solid var(--red);
  padding-bottom: 6px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px;
  margin-bottom: 12px;
}
.title {
  font-size: .95rem;
  font-weight: bold;
  color: #f0a0a0;
  border-bottom: 2px solid var(--red);
  padding-bottom: 4px;
  margin-bottom: 8px;
  font-family: serif;
}
.part-header {
  background: #2a0808;
  border: 1px solid var(--red);
  color: #ffffff;
  padding: 4px 8px;
  font-weight: bold;
  font-size: .9rem;
  margin-top: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  letter-spacing: 1px;
}
.part-header .val {
  font-size: .75rem;
  color: #ddd;
  font-weight: normal;
}
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
label { display: block; font-size: .75rem; color: #aaa; margin-bottom: 2px; }
input, select, textarea {
  width: 100%;
  padding: 5px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--input);
  color: #fff;
  font-size: .85rem;
  font-family: sans-serif;
  text-align: center;
}
input[type="text"] { text-align: left; }
textarea { text-align: left; resize: vertical; }
.table-scroll { width: 100%; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 4px; min-width: 100%; }
th, td { border: 1px solid var(--border); padding: 4px 2px; text-align: center; font-size: .8rem; }
th { background: var(--header-bg); color: #eee; font-weight: normal; letter-spacing: 1px; }
.calc-table { background: #121215; margin-bottom: 8px; }
.calc-table th { background: #22222a; color: #ccc; font-weight: bold; }
.calc-table td.label-cell { background: #1e1e24; text-align: right; padding-right: 8px; font-weight: bold; color: #ddd; }
.calc-table input[type="number"] { width: 100%; background: #18181c; border: 1px solid #444; color: #fff; font-weight: bold; }
.calc-table input[type="radio"] { width: 18px; height: 18px; accent-color: var(--red); cursor: pointer; margin: 0 auto; }
.calc-table .total-row td { background: #2a0808; color: #fff; font-size: 1rem; font-weight: bold; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
button {
  padding: 8px;
  border: none;
  border-radius: 4px;
  background: var(--red);
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  font-size: .85rem;
  font-family: sans-serif;
}
button:hover { opacity: 0.9; }
button.sec { background: #4a4a52; }
button.del { background: #522; color: #f88; padding: 2px 6px; }
.add-part-select {
  width: 100%;
  margin-top: 6px;
  padding: 6px;
  background: #25252d;
  color: #f0a0a0;
  border: 1px dashed var(--border);
  border-radius: 3px;
  font-size: .85rem;
  cursor: pointer;
}
tr.broken input, tr.broken textarea {
  text-decoration: line-through;
  opacity: 0.5;
}
</style>
</head>
<body>

<h1>永い後日談のネクロニカ</h1>

<div class="card">
  <div class="title">基本情報・強化値計算</div>
  <div class="g2">
    <div><label>PL名</label><input type="text" id="pl"></div>
    <div><label>ドール名</label><input type="text" id="name"></div>
  </div>
  <div class="table-scroll">
    <table class="calc-table">
      <thead>
        <tr>
          <th style="width:30%">区分</th>
          <th style="width:34%">選択</th>
          <th style="width:12%">武装</th>
          <th style="width:12%">変異</th>
          <th style="width:12%">改造</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="label-cell">ポジション：</td>
          <td>
            <select id="pos" onchange="onClassChange()">
              <option>アリス</option>
              <option>ホリック</option>
              <option>オートマトン</option>
              <option>ジャンク</option>
              <option>コート</option>
              <option>ソロリティ</option>
            </select>
          </td>
          <td>-</td><td>-</td><td>-</td>
        </tr>
        <tr>
          <td class="label-cell">メインクラス：</td>
          <td>
            <select id="mc" onchange="onClassChange()">
              <option selected>ロマネスク</option>
              <option>ステーシー</option>
              <option>タナトス</option>
              <option>レクイエム</option>
              <option>バロック</option>
              <option>ホリック</option>
              <option>ゴシック</option>
            </select>
          </td>
          <td id="mc-wep">0</td><td id="mc-mut">0</td><td id="mc-cyb">2</td>
        </tr>
        <tr>
          <td class="label-cell">サブクラス：</td>
          <td>
            <select id="sc" onchange="onClassChange()">
              <option selected>ロマネスク</option>
              <option>ステーシー</option>
              <option>タナトス</option>
              <option>レクイエム</option>
              <option>バロック</option>
              <option>ホリック</option>
              <option>ゴシック</option>
            </select>
          </td>
          <td id="sc-wep">0</td><td id="sc-mut">0</td><td id="sc-cyb">2</td>
        </tr>
        <tr>
          <td class="label-cell">ボーナス：</td>
          <td style="color:#aaa;font-size:.75rem">いずれか+1</td>
          <td><input type="radio" name="bonus" value="wep" checked onchange="calcTotals()"></td>
          <td><input type="radio" name="bonus" value="mut" onchange="calcTotals()"></td>
          <td><input type="radio" name="bonus" value="cyb" onchange="calcTotals()"></td>
        </tr>
        <tr>
          <td class="label-cell">寵愛による修正：</td>
          <td style="color:#aaa;font-size:.75rem">手入力加算</td>
          <td><input type="number" id="chouai-wep" value="0" min="0" oninput="calcTotals()"></td>
          <td><input type="number" id="chouai-mut" value="0" min="0" oninput="calcTotals()"></td>
          <td><input type="number" id="chouai-cyb" value="0" min="0" oninput="calcTotals()"></td>
        </tr>
        <tr class="total-row">
          <td class="label-cell" style="color:#ffaaaa">総計</td>
          <td style="font-size:.75rem;color:#ccc">パーツ配置上限</td>
          <td id="total-wep">1</td>
          <td id="total-mut">0</td>
          <td id="total-cyb">5</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="g2">
    <div><label>享年/外見</label><input type="text" id="age"></div>
    <div><label>初期配置</label>
      <select id="ps">
        <option>煉獄</option>
        <option>花園</option>
        <option>楽園</option>
      </select>
    </div>
  </div>
  <div class="g2">
    <div><label>暗示</label><input type="text" id="hint"></div>
    <div><label>記憶のカケラ</label><input type="text" id="mem"></div>
  </div>
  <div class="g2">
    <div><label>最大行動値</label><input type="number" id="act" value="9"></div>
    <div><label>獲得寵愛点</label><input type="number" id="fav" value="0"></div>
  </div>
</div>

<div class="card">
  <div class="title">習得スキル</div>
  <div class="table-scroll">
    <table class="sheet-table">
      <thead>
        <tr>
          <th style="width:20%;">区分</th>
          <th style="width:30%;">スキル名</th>
          <th>効果メモ</th>
          <th style="width:10%;">操作</th>
        </tr>
      </thead>
      <tbody id="skill-tbody"></tbody>
    </table>
  </div>
  <div style="margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;">
    <button type="button" class="sec" onclick="addPosSkillRow()" style="width:100%;padding:6px">+ ポジション</button>
    <button type="button" class="sec" onclick="addMcSkillRow()" style="width:100%;padding:6px">+ メインクラス</button>
    <button type="button" class="sec" onclick="addScSkillRow()" style="width:100%;padding:6px">+ サブクラス</button>
  </div>
</div>

<div class="card">
  <div class="title" style="display:flex;justify-content:space-between;align-items:center">
    <span>配置パーツ・マニューバ</span>
    <button type="button" class="sec" onclick="resetUsed()" style="font-size:.7rem;padding:2px 6px">破損チェックを一括解除</button>
  </div>
  <div id="parts-container"></div>
</div>

<div class="card">
  <div class="title">たからもの・未練（姉妹への感情）</div>
  <div style="margin-bottom:6px"><label>たからもの</label><input type="text" id="tr"></div>
  <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th style="width:25%">対象（姉妹）</th>
          <th style="width:25%">未練（感情）</th>
          <th style="width:35%">狂気点</th>
          <th style="width:15%">操作</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>
  <button type="button" class="sec" onclick="addRow()" style="width:100%;margin-top:4px;padding:4px">+ 未練枠を追加</button>
</div>

<div class="btns">
  <button type="button" onclick="saveData()">ブラウザ保存</button>
  <button type="button" class="sec" onclick="loadData()">保存データを読み込む</button>
</div>
<div class="btns">
  <button type="button" class="sec" onclick="exportCcfolia()">ココフォリア出力</button>
  <button type="button" class="sec" onclick="exportJSON()">JSON保存</button>
</div>

<script>
const SKILL_DATABASE = {
  'アリス': [
    { name: '少女', memo: '【少女】 R/0/0\n対象の姉妹1人と対話判定を行う' },
    { name: 'お嬢様', memo: '【お嬢様】 D/0/0〜1\n自身がダメージを受けた際のみ使用可能\n他の姉妹1人の次のアクションのコストを-1' },
    { name: '癒し', memo: '【癒し】 O/無し/参照\n他の姉妹からの、あなたに対する対話判定は全て出目-1' },
    { name: '楽園の天使', memo: '【楽園の天使】 R/2/自\n現在の位置に関係なく、「楽園」に配置する。これは移動ではない。' },
    { name: '負けない心', memo: '【負けない心】 O/無し/自\n対話判定の出目+1' },
    { name: '祈り', memo: '【祈り】 A/0/参照\nこれが宣言されたカウントを1として数え始めて5カウント目の終了時に効果が発動する\n宣言時から効果発動までの間、自身が狂気点追加、損傷がともになければ、あなたを含む姉妹全員は各自の未練から1つを選んで狂気点-1\n1ターンに1度、残りカウントが5以上なければ宣言できない' },
    { name: '輝く表情', memo: '【輝く表情】 O/無し/自\nあなたが対話判定で大成功したなら、対話対象はあなたへの未練から狂気点-1できる。記憶のカケラの減少制限に含まれる' }
  ],
  'ホリック': [
    { name: '加速する狂気', memo: '【加速する狂気】 O/無し/自\nバトルパートで発狂状態の未練がある際、攻撃判定+1' },
    { name: '業怒', memo: '【業怒】 D/参照/自\n自身が与えたダメージに対してのみ使用可能\nコストとして、あなたは任意の未練に狂気点+1する。ダメージ+2' },
    { name: '衝動', memo: '【衝動】 O/参照/自\n1ターンに1回、コストを支払う代わりに、任意の未練に狂気点+1をコストとして扱う' },

    { name: '堕地獄', memo: '【堕地獄】 A/参照/自\nコストの代わりに、任意の未練へ狂気点+1\n配置エリア地獄に変更' },
    { name: '狂気の果て', memo: '【狂気の果て】 D/0/自\n任意の未練から狂気点-1\n同じエリアに他の姉妹がいるなら、その姉妹は未練を1つ選び、狂気点+1' }

  'オートマトン': [

    { name: '私は人形', memo: '【私は人形】 O/無し/自\nバトルパートで1ターン目のみ、あらゆる発狂状態の効果を無し視してよい' },

    { name: '氷の心', memo: '【氷の心】 O/無し/自\n狂気判定の出目+1' },
    { name: '血の涙', memo: '【血の涙】 O/参照/自\n精神攻撃によって与えられる狂気点を無し視できる\n基本パーツ1つ損傷。基本パーツがない場合は使用不可' },
    { name: '敵は敵', memo: '【敵は敵】 O/無し/自\nあなたに対する精神攻撃の判定値を7以上にする' }

  'コート': [

    { name: '憎まれ役', memo: '【憎まれ役】 O/参照/参照\n他の姉妹が、狂気判定に失敗または大失敗した際、その結果を成功に変えてもよい\n任意の未練に狂気点+1' }
  ],
  'ソロリティ': [
    { name: '号令', memo: '【号令】 R/2/参照\nあなたを含む舞台上にいる姉妹全員、攻撃マニューバ1つをラピッドとして使用してよい' },
    { name: '内緒話', memo: '【内緒話】 O/無し/参照\nバトルパート開始時と終了時、任意の姉妹1人と互いに対話判定できる' },
    { name: '克己心', memo: '【克己心】 O/無し/自\n発狂状態のとき、狂気・対話判定の出目+1' },
    { name: '優雅', memo: '【優雅】 O/無し/参照\n狂気点で振り直す際、任意の姉妹1人にあなたを対象とした対話判定をさせてよい' },
    { name: '花園の集い', memo: '【花園の集い】 R/2/参照\nあなたを含む姉妹全員、花園に配置を変更する\nこれは移動ではない' },
    { name: '姉妹のくちづけ', memo: '【姉妹のくちづけ】 R/1/0\nサヴァントに対してのみ使用可\n対象サヴァントは現在行動値-4' },
    { name: '心を鬼にして', memo: '【心を鬼にして】 O/無し/参照\nあなたの攻撃によって、姉妹のパーツを損傷させたなら、その姉妹は発狂状態の未練を1つ選び、狂気点-1させる。' }
  ],
  'ステーシー': [
    { name: '蠢く肉片', memo: '【蠢く肉片】 J/0/0〜2\nダメージを受けている際のみ使用可\n妨害3' },
    { name: '平気', memo: '【平気】 O/無し/自\n損傷しても、ターン終了まではそのパーツは使える' },
    { name: '死に続け', memo: '【死に続け】 R/0/自\n損傷している基本パーツを1つ修復' },
    { name: '庇う', memo: '【庇う】 D/0/0〜1\n対象のダメージを自身が肩代わりできる\n1ターンに何度でも使用可' },
    { name: '肉の盾', memo: '【肉の盾】 D/0/0〜1\nダメージに付随する効果すべてを打ち消す' },

    { name: '臓物豚', memo: '【臓物豚】 O/無し/参照\n戦闘終了時、あなたを含む姉妹全員、損傷している【はらわた】を修復できる' },
    { name: '死人の流儀', memo: '【死人の流儀】 J/参照/0〜1\nコストの代わりに、任意の基本パーツを1つ損傷\n支援2か妨害2' }
  ],
  'タナトス': [
    { name: '無し限解体', memo: '【無し限解体】 D/0/自\nダメージを与えた際のみ使用可\n次カウントまで所有する攻撃マニューバは、同対象に使う限りタイミングがダメージとなる' },

const PART_LIMIT_TABLE = {
  1: [1, 0, 0],
  2: [1, 1, 0],
  3: [1, 1, 1],
  4: [2, 1, 1],
  5: [2, 2, 1],
  6: [2, 2, 2],
  7: [3, 2, 2],
  8: [3, 3, 2],
  9: [3, 3, 3]
};

function renderPartsContainer() {
  const container = document.getElementById('parts-container');
  if (!container) return;
  container.innerHTML = '';

  const sections = [
    { id: 'head', title: '頭部', val: '（最大数値：2）' },
    { id: 'arm', title: '腕部', val: '（最大数値：2）' },
    { id: 'body', title: '胴部', val: '（最大数値：2）' },
    { id: 'leg', title: '脚部', val: '（最大数値：2）' }
  ];

  sections.forEach(sec => {
    const secDiv = document.createElement('div');
    
    let optionsHtml = `<option value="">+ 【${sec.title}】にパーツを選択して追加...</option>`;
    optionsHtml += `<option value="custom">-- 自由入力枠を追加 --</option>`;
    
    if (EXTRA_PARTS_DB[sec.id]) {
      EXTRA_PARTS_DB[sec.id].forEach((p, idx) => {
        optionsHtml += `<option value="${sec.id}_${idx}">[${p.type} Lv${p.level}] ${p.name}</option>`;
      });
    }

    secDiv.innerHTML = `
      <div class="part-header"><span>${sec.title}</span><span class="val">${sec.val}</span></div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:8%">破損</th>
              <th style="width:20%">パーツ名</th>
              <th style="width:10%">種別</th>
              <th style="width:8%">Lv</th>
              <th style="width:12%">タイミング</th>
              <th style="width:8%">コスト</th>
              <th style="width:10%">射程</th>
              <th style="width:18%">効果メモ</th>
              <th style="width:6%">操作</th>
            </tr>
          </thead>
          <tbody id="parts-tbody-${sec.id}"></tbody>
        </table>
      </div>
      <div style="margin-top:6px;">
        <select class="add-part-select" onchange="onExtraPartSelect('${sec.id}', this)">
          ${optionsHtml}
        </select>
      </div>
    `;
    container.appendChild(secDiv);

    const tbody = secDiv.querySelector(`#parts-tbody-${sec.id}`);
    if (DEFAULT_PARTS[sec.id]) {
      DEFAULT_PARTS[sec.id].forEach(p => {
        addPartRow(tbody, p.name, p.type, p.level, p.timing, p.cost, p.range, p.memo, false);
      });
    }
  });
}

function countExistingParts(categoryType, level) {
  let count = 0;
  const rows = document.querySelectorAll('#parts-container tr');
  rows.forEach(tr => {
    const typeInput = tr.querySelector('.p-type');
    const lvInput = tr.querySelector('.p-level');
    if (typeInput && lvInput) {
      if (typeInput.value === categoryType && parseInt(lvInput.value, 10) === level) {
        count++;
      }
    }
  });
  return count;
}

function onExtraPartSelect(secId, selectElem) {
  const val = selectElem.value;
  if (!val) return;

  const tbody = document.getElementById(`parts-tbody-${secId}`);
  if (!tbody) return;

  if (val === 'custom') {
    addPartRow(tbody, '新規パーツ', '武装', 1, 'アクション', '1', '0', '', true);
  } else {
    const [sId, idxStr] = val.split('_');
    const idx = parseInt(idxStr, 10);
    const p = EXTRA_PARTS_DB[sId][idx];
    if (p) {
      let categoryKey = '';
      if (p.type === '武装') categoryKey = 'wep';
      else if (p.type === '変異') categoryKey = 'mut';
      else if (p.type === '改造') categoryKey = 'cyb';

      if (categoryKey) {
        const totalValElem = document.getElementById(`total-${categoryKey}`);
        const currentTotal = totalValElem ? parseInt(totalValElem.textContent, 10) || 1 : 1;
        
        const tableLimits = PART_LIMIT_TABLE[currentTotal] || PART_LIMIT_TABLE[9];
        const maxLimit = tableLimits[p.level - 1] ?? 0;
        const currentCount = countExistingParts(p.type, p.level);

        if (currentCount >= maxLimit) {
          alert(`【${p.type}】の強化値（現在 ${currentTotal}）におけるLv${p.level}パーツの取得上限（${maxLimit}個）に達しているため追加できません。`);
          selectElem.value = '';
          return;
        }
      }

      addPartRow(tbody, p.name, p.type, p.level, p.timing, p.cost, p.range, p.memo, true);
    }
  }
  selectElem.value = '';
}

function addPartRow(tbody, name='', type='基本', level=1, timing='オート', cost='0', range='0', memo='', isRemovable=true) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="checkbox" onchange="toggleBroken(this)" style="width:16px;height:16px;cursor:pointer;"></td>
    <td><input type="text" class="p-name" value="${name}"></td>
    <td><input type="text" class="p-type" value="${type}" ${isRemovable ? '' : 'readonly style="background:#151518;color:#aaa;"'}></td>
    <td><input type="number" class="p-level" value="${level}" min="1" max="3" style="width:40px;" ${isRemovable ? '' : 'readonly style="background:#151518;color:#aaa;"'}></td>
    <td><input type="text" class="p-timing" value="${timing}"></td>
    <td><input type="text" class="p-cost" value="${cost}"></td>
    <td><input type="text" class="p-range" value="${range}"></td>
    <td><textarea class="p-memo" rows="1">${memo}</textarea></td>
    <td>${isRemovable ? '<button type="button" class="del" onclick="this.closest(\'tr\').remove()">削</button>' : '-'}</td>
  `;
  tbody.appendChild(tr);
}

function toggleBroken(chk) {
  const tr = chk.closest('tr');
  if (chk.checked) {
    tr.classList.add('broken');
  } else {
    tr.classList.remove('broken');
  }
}

function resetUsed() {
  const checkboxes = document.querySelectorAll('#parts-container input[type="checkbox"]');
  checkboxes.forEach(chk => {
    chk.checked = false;
    toggleBroken(chk);
  });
}

function onClassChange() {
  const mc = document.getElementById('mc').value;
  const sc = document.getElementById('sc').value;
  const mcVal = CLASS_PARTS[mc] || [0,0,0];
  const scVal = CLASS_PARTS[sc] || [0,0,0];

  document.getElementById('mc-wep').textContent = mcVal[0];
  document.getElementById('mc-mut').textContent = mcVal[1];
  document.getElementById('mc-cyb').textContent = mcVal[2];

  document.getElementById('sc-wep').textContent = scVal[0];
  document.getElementById('sc-mut').textContent = scVal[1];
  document.getElementById('sc-cyb').textContent = scVal[2];

  calcTotals();
  updateSkillRowsFromClass();
}

function updateSkillRowsFromClass() {
  const pos = document.getElementById('pos').value;
  const mc = document.getElementById('mc').value;
  const sc = document.getElementById('sc').value;

  const rows = document.querySelectorAll('#skill-tbody tr');

  if (rows[0]) {
    const typeInput = rows[0].querySelector('.sk-type');
    if (typeInput) typeInput.value = pos;
    updateSkillSelectOptions(rows[0].querySelector('.sk-select'), [pos]);
  }

  for (let i = 1; i < rows.length; i++) {
    const typeInput = rows[i].querySelector('.sk-type');
    const selectElem = rows[i].querySelector('.sk-select');
    if (typeInput) {
      const role = typeInput.getAttribute('data-role');
      const targetClass = (role === 'sc') ? sc : mc;
      typeInput.value = targetClass;
      updateSkillSelectOptions(selectElem, [targetClass]);
    }
  }
}

function updateSkillSelectOptions(selectElem, categories) {
  if (!selectElem) return;

  const currentVal = selectElem.value;
  selectElem.innerHTML = '<option value="">-- スキルを選択 --</option>';

  categories.forEach(cat => {
    const skills = SKILL_DATABASE[cat];
    if (skills) {
      const group = document.createElement('optgroup');
      group.label = `【${cat}】`;
      
      skills.forEach(s => {
        const opt = document.createElement('option');
        opt.value = JSON.stringify({ cat: cat, name: s.name, memo: s.memo });
        opt.textContent = s.name;
        group.appendChild(opt);
      });
      
      selectElem.appendChild(group);
    }
  });

  if (currentVal) {
    selectElem.value = currentVal;
  }
}

}

function addScSkillRow(type='', skillData='', memo='', isRemovable=true) {
  addClassSkillRow('sc', type, skillData, memo, isRemovable);
}

function onSkillSelectChange(sel) {
  const tr = sel.closest('tr');
  const memoTextarea = tr.querySelector('.sk-memo');
  if (!memoTextarea) return;

  if (!sel.value) {
    memoTextarea.value = '';
    return;
  }

  try {
    const data = JSON.parse(sel.value);
    if (data && data.memo) {
      memoTextarea.value = data.memo;
    }
  } catch (e) {
    memoTextarea.value = '';
  }
}

function calcTotals() {
  const mcWep = parseInt(document.getElementById('mc-wep').textContent, 10) || 0;
  const mcMut = parseInt(document.getElementById('mc-mut').textContent, 10) || 0;
  const mcCyb = parseInt(document.getElementById('mc-cyb').textContent, 10) || 0;

  const scWep = parseInt(document.getElementById('sc-wep').textContent, 10) || 0;
  const scMut = parseInt(document.getElementById('sc-mut').textContent, 10) || 0;
  const scCyb = parseInt(document.getElementById('sc-cyb').textContent, 10) || 0;

  let bonusWep = 0, bonusMut = 0, bonusCyb = 0;
  const bonusRadios = document.getElementsByName('bonus');
  bonusRadios.forEach(r => {
    if (r.checked) {
      if (r.value === 'wep') bonusWep = 1;
      if (r.value === 'mut') bonusMut = 1;
      if (r.value === 'cyb') bonusCyb = 1;
    }
  });

  const chouaiWep = parseInt(document.getElementById('chouai-wep').value, 10) || 0;
  const chouaiMut = parseInt(document.getElementById('chouai-mut').value, 10) || 0;
  const chouaiCyb = parseInt(document.getElementById('chouai-cyb').value, 10) || 0;

  const totalWep = mcWep + scWep + bonusWep + chouaiWep;
  const totalMut = mcMut + scMut + bonusMut + chouaiMut;
  const totalCyb = mcCyb + scCyb + bonusCyb + chouaiCyb;

  document.getElementById('total-wep').textContent = totalWep;
  document.getElementById('total-mut').textContent = totalMut;
  document.getElementById('total-cyb').textContent = totalCyb;
}

  `;

}

function saveData() {
  const data = {
    pl: document.getElementById('pl').value,
    name: document.getElementById('name').value,
    pos: document.getElementById('pos').value,
    mc: document.getElementById('mc').value,
    sc: document.getElementById('sc').value,
    bonus: document.querySelector('input[name="bonus"]:checked')?.value || 'wep',
    chouaiWep: document.getElementById('chouai-wep').value,
    chouaiMut: document.getElementById('chouai-mut').value,
    chouaiCyb: document.getElementById('chouai-cyb').value,
    age: document.getElementById('age').value,
    ps: document.getElementById('ps').value,
    hint: document.getElementById('hint').value,
    mem: document.getElementById('mem').value,
    act: document.getElementById('act').value,
    fav: document.getElementById('fav').value,
    tr: document.getElementById('tr').value,
    skills: [],
    parts: {},
    relations: []
  };

  const skillRows = document.querySelectorAll('#skill-tbody tr');
  skillRows.forEach(tr => {
    const typeInput = tr.querySelector('.sk-type');
    const selectElem = tr.querySelector('.sk-select');
    const memoArea = tr.querySelector('.sk-memo');
    data.skills.push({
      role: typeInput?.getAttribute('data-role') || 'pos',
      type: typeInput?.value || '',
      skillData: selectElem?.value || '',
      memo: memoArea?.value || ''
    });
  });

  ['head', 'arm', 'body', 'leg'].forEach(secId => {
    data.parts[secId] = [];
    const rows = document.querySelectorAll(`#parts-tbody-${secId} tr`);
    rows.forEach(tr => {
      data.parts[secId].push({
        broken: tr.querySelector('input[type="checkbox"]').checked,
        name: tr.querySelector('.p-name').value,
        type: tr.querySelector('.p-type').value,
        level: tr.querySelector('.p-level').value,
        timing: tr.querySelector('.p-timing').value,
        cost: tr.querySelector('.p-cost').value,
        range: tr.querySelector('.p-range').value,
        memo: tr.querySelector('.p-memo').value,
        isRemovable: tr.querySelector('.del') !== null
      });
    });
  });

  const relationRows = document.querySelectorAll('#list tr');
  relationRows.forEach(tr => {
    data.relations.push({
      target: tr.querySelector('.tr-target').value,
      emotion: tr.querySelector('.tr-emotion').value,
      mad: tr.querySelector('.tr-mad').value
    });
  });

  localStorage.setItem('nechronica_sheet_data', JSON.stringify(data));
  alert('ブラウザにデータを保存しました。');
}

function loadData() {
  const jsonStr = localStorage.getItem('nechronica_sheet_data');
  if (!jsonStr) {
    alert('保存されたデータが見つかりません。');
    return;
  }
  try {
    const data = JSON.parse(jsonStr);
    document.getElementById('pl').value = data.pl || '';
    document.getElementById('name').value = data.name || '';
    document.getElementById('pos').value = data.pos || 'アリス';
    document.getElementById('mc').value = data.mc || 'ロマネスク';
    document.getElementById('sc').value = data.sc || 'ロマネスク';

    if (data.bonus) {
      const radio = document.querySelector(`input[name="bonus"][value="${data.bonus}"]`);
      if (radio) radio.checked = true;
    }

    document.getElementById('chouai-wep').value = data.chouaiWep || '0';
    document.getElementById('chouai-mut').value = data.chouaiMut || '0';
    document.getElementById('chouai-cyb').value = data.chouaiCyb || '0';
    document.getElementById('age').value = data.age || '';
    document.getElementById('ps').value = data.ps || '煉獄';
    document.getElementById('hint').value = data.hint || '';
    document.getElementById('mem').value = data.mem || '';
    document.getElementById('act').value = data.act || '9';
    document.getElementById('fav').value = data.fav || '0';
    document.getElementById('tr').value = data.tr || '';

    onClassChange();

    const skillTbody = document.getElementById('skill-tbody');
    if (skillTbody) skillTbody.innerHTML = '';
    if (data.skills && data.skills.length > 0) {
      data.skills.forEach(s => {
        if (s.role === 'pos') {
          addPosSkillRow(s.type, s.skillData, s.memo, true);
        } else {
          addClassSkillRow(s.role, s.type, s.skillData, s.memo, true);
        }
      });
    } else {
      addPosSkillRow();
      addMcSkillRow('mc');
      addScSkillRow('sc');
    }

    if (data.parts) {
      ['head', 'arm', 'body', 'leg'].forEach(secId => {
        const tbody = document.getElementById(`parts-tbody-${secId}`);
        if (tbody) tbody.innerHTML = '';
        if (data.parts[secId]) {
          data.parts[secId].forEach(p => {
            addPartRow(tbody, p.name, p.type, p.level, p.timing, p.cost, p.range, p.memo, p.isRemovable);
            if (p.broken) {
              const lastTr = tbody.lastElementChild;
              const chk = lastTr.querySelector('input[type="checkbox"]');
              if (chk) {
                chk.checked = true;
                toggleBroken(chk);
              }
            }
          });
        }
      });
    }

    const relationTbody = document.getElementById('list');
    if (relationTbody) relationTbody.innerHTML = '';
    if (data.relations && data.relations.length > 0) {
      data.relations.forEach(r => {
        addRow(r.target, r.emotion, r.mad);
      });
    }

    alert('保存データを読み込みました。');
  } catch (e) {
    alert('データの読み込みに失敗しました。');
  }
}

function exportJSON() {
  const data = {
    pl: document.getElementById('pl').value,
    name: document.getElementById('name').value,
    pos: document.getElementById('pos').value,
    mc: document.getElementById('mc').value,
    sc: document.getElementById('sc').value,
    bonus: document.querySelector('input[name="bonus"]:checked')?.value || 'wep',
    chouaiWep: document.getElementById('chouai-wep').value,
    chouaiMut: document.getElementById('chouai-mut').value,
    chouaiCyb: document.getElementById('chouai-cyb').value,
    age: document.getElementById('age').value,
    ps: document.getElementById('ps').value,
    hint: document.getElementById('hint').value,
    mem: document.getElementById('mem').value,
    act: document.getElementById('act').value,
    fav: document.getElementById('fav').value,
    tr: document.getElementById('tr').value
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (data.name || 'nechronica_sheet') + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
