<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネクロニカ キャラクターシート</title>
  <style>
    :root {
      --bg-color: #1a1a1a;
      --card-bg: #2a2a2a;
      --text-color: #e0e0e0;
      --accent-color: #8b0000;
      --border-color: #444;
      --input-bg: #333;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      font-size: 14px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    h1, h2 {
      color: #ff4d4d;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 5px;
      margin-top: 15px;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 3px;
    }

    input, select, textarea {
      background-color: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 4px;
      box-sizing: border-box;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 6px;
      text-align: left;
    }

    th {
      background-color: #333;
      color: #ff8888;
      font-size: 12px;
    }

    .btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 5px;
    }

    .btn-danger {
      background-color: #551111;
    }

    .action-btns {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ネクロニカ キャラクターシート</h1>

  <!-- 基本情報 -->
  <h2>基本情報</h2>
  <div class="grid">
    <div class="form-group">
      <label>ドール名</label>
      <input type="text" id="doll-name" placeholder="名前">
    </div>
    <div class="form-group">
      <label>プレイヤー名</label>
      <input type="text" id="player-name">
    </div>
    <div class="form-group">
      <label>ポジション</label>
      <select id="pos" onchange="updateAllSkillDropdowns()">
        <option value="アリス">アリス</option>
        <option value="ホリック">ホリック</option>
        <option value="オートマトン">オートマトン</option>
        <option value="ジャンク">ジャンク</option>
        <option value="コート">コート</option>
        <option value="ソロリティ">ソロリティ</option>
      </select>
    </div>
    <div class="form-group">
      <label>メインクラス</label>
      <select id="mc" onchange="updateAllSkillDropdowns()">
        <option value="ロマネスク">ロマネスク</option>
        <option value="ステーシー">ステーシー</option>
        <option value="タナトス">タナトス</option>
        <option value="レクイエム">レクイエム</option>
        <option value="バロック">バロック</option>
        <option value="ゴシック">ゴシック</option>
      </select>
    </div>
    <div class="form-group">
      <label>サブクラス</label>
      <select id="sc" onchange="updateAllSkillDropdowns()">
        <option value="ステーシー">ステーシー</option>
        <option value="ロマネスク">ロマネスク</option>
        <option value="タナトス">タナトス</option>
        <option value="レクイエム">レクイエム</option>
        <option value="バロック">バロック</option>
        <option value="ゴシック">ゴシック</option>
      </select>
    </div>
  </div>

  <!-- スキル一覧 -->
  <h2>スキル</h2>
  <table id="skill-table">
    <thead>
      <tr>
        <th style="width: 30%;">区分</th>
        <th style="width: 60%;">スキル名</th>
        <th style="width: 10%;">操作</th>
      </tr>
    </thead>
    <tbody id="skill-tbody">
      <!-- JavaScriptで動的生成 -->
    </tbody>
  </table>
  <button class="btn" onclick="addSkillRow()">+ スキル枠を追加</button>

  <!-- 保存・操作 -->
  <div class="action-btns">
    <button class="btn" onclick="saveData()">ブラウザに保存</button>
    <button class="btn" onclick="loadData()">保存データを読み込み</button>
  </div>
</div>

<script>
  // スキルデータ定義
  const SKILL_DATA = {
    position: {
      "アリス": ["おねだり", "てとりあしとり", "こんがらがる", "いたいのいたいのとんでけ", "おともだち"],
      "ホリック": ["過剰脱法", "狂乱の宴", "自傷癖", "自棄", "薬物依存"],
      "オートマトン": ["プログラム", "オートガード", "ターゲット解析", "完全機械化", "オーバークロック"],
      "ジャンク": ["解体作業", "がらくた集め", "ジャンクパーツ", "修理", "土壇場"],
      "コート": ["冷酷", "指揮", "分析", "戦略", "追撃"],
      "ソロリティ": ["姉妹愛", "乙女の祈り", "かばう", "先導", "絆"]
    },
    class: {
      "ロマネスク": ["優雅", "舞踏", "花園", "ドレス", "銀の髪"],
      "ステーシー": ["死ねない身体", "肉体の悪魔", "死の舞踏", "無痛", "腐敗"],
      "タナトス": ["死神", "屠殺", "大鎌", "即死", "漆黒"],
      "レクイエム": ["銃撃", "早撃ち", "狙撃", "弾幕", "処刑"],
      "バロック": ["異形", "伸縮", "変異", "狂い咲き", "浸食"],
      "ゴシック": ["鉄鎖", "拷問", "断罪", "処刑台", "拘束"]
    }
  };

  // 初期スキル枠の追加
  window.onload = function() {
    addSkillRow('ポジション');
    addSkillRow('メインスキル');
    addSkillRow('サブクラス');
  };

  function addSkillRow(defaultType = 'ポジション', skillName = null) {
    const tbody = document.getElementById('skill-tbody');
    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>
        <select class="skill-type-select" onchange="updateSkillRowOptions(this.closest('tr'))">
          <option value="ポジション" ${defaultType === 'ポジション' ? 'selected' : ''}>ポジション</option>
          <option value="メインスキル" ${defaultType === 'メインスキル' ? 'selected' : ''}>メインスキル</option>
          <option value="サブクラス" ${defaultType === 'サブクラス' ? 'selected' : ''}>サブクラス</option>
          <option value="その他" ${defaultType === 'その他' ? 'selected' : ''}>その他</option>
        </select>
      </td>
      <td class="skill-name-cell"></td>
      <td><button class="btn btn-danger" onclick="removeRow(this)">削除</button></td>
    `;

    tbody.appendChild(tr);
    updateSkillRowOptions(tr, skillName);
  }

  function removeRow(btn) {
    const tr = btn.closest('tr');
    tr.remove();
  }

  // 行ごとのスキル選択肢（ドロップダウン）を更新する関数
  function updateSkillRowOptions(tr, targetSkill = null) {
    const category = tr.querySelector('.skill-type-select').value;
    const cell = tr.querySelector('.skill-name-cell');

    const posVal = document.getElementById('pos').value;
    const mcVal = document.getElementById('mc').value;
    const scVal = document.getElementById('sc').value;

    const currentSelect = cell.querySelector('.skill-name-select');
    const currentInput = cell.querySelector('.skill-name-input');
    
    // 現在の選択内容を維持
    const activeSkill = (targetSkill !== null) 
      ? targetSkill 
      : (currentSelect ? currentSelect.value : (currentInput ? currentInput.value : ''));

    let skillList = [];

    if (category === 'ポジション') {
      skillList = SKILL_DATA.position[posVal] || [];
    } else if (category === 'メインスキル') {
      skillList = SKILL_DATA.class[mcVal] || [];
    } else if (category === 'サブクラス') {
      skillList = SKILL_DATA.class[scVal] || [];
    }

    if (category === 'その他' || skillList.length === 0) {
      cell.innerHTML = `<input type="text" class="skill-name-input" value="${activeSkill}" placeholder="スキル名を入力">`;
    } else {
      let selectHtml = `<select class="skill-name-select">`;
      const selectedValue = skillList.includes(activeSkill) ? activeSkill : skillList[0];

      skillList.forEach(s => {
        const isSelected = (s === selectedValue) ? 'selected' : '';
        selectHtml += `<option value="${s}" ${isSelected}>${s}</option>`;
      });
      selectHtml += `</select>`;
      cell.innerHTML = selectHtml;
    }
  }

  function updateAllSkillDropdowns() {
    const rows = document.querySelectorAll('#skill-tbody tr');
    rows.forEach(tr => {
      updateSkillRowOptions(tr);
    });
  }

  // ローカルストレージへの保存・読み込み
  function saveData() {
    const data = {
      dollName: document.getElementById('doll-name').value,
      playerName: document.getElementById('player-name').value,
      pos: document.getElementById('pos').value,
      mc: document.getElementById('mc').value,
      sc: document.getElementById('sc').value,
      skills: []
    };

    const rows = document.querySelectorAll('#skill-tbody tr');
    rows.forEach(tr => {
      const type = tr.querySelector('.skill-type-select').value;
      const select = tr.querySelector('.skill-name-select');
      const input = tr.querySelector('.skill-name-input');
      const name = select ? select.value : (input ? input.value : '');
      data.skills.push({ type, name });
    });

    localStorage.setItem('nechronica_sheet', JSON.stringify(data));
    alert('保存しました！');
  }

  function loadData() {
    const saved = localStorage.getItem('nechronica_sheet');
    if (!saved) {
      alert('保存データがありません。');
      return;
    }

    const data = JSON.parse(saved);
    document.getElementById('doll-name').value = data.dollName || '';
    document.getElementById('player-name').value = data.playerName || '';
    document.getElementById('pos').value = data.pos || 'アリス';
    document.getElementById('mc').value = data.mc || 'ロマネスク';
    document.getElementById('sc').value = data.sc || 'ステーシー';

    const tbody = document.getElementById('skill-tbody');
    tbody.innerHTML = '';

    if (data.skills && data.skills.length > 0) {
      data.skills.forEach(s => {
        addSkillRow(s.type, s.name);
      });
    } else {
      addSkillRow('ポジション');
      addSkillRow('メインスキル');
      addSkillRow('サブクラス');
    }

    alert('読み込みました！');
  }
</script>

</body>
</html>
